spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/user}
  data:
    mongodb:
      # required: creates the unique index on users.email declared with @Indexed(unique = true)
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    shutdown:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8082

logging:
  level:
    root: info
    com.ecommerce.user: trace
  file:
    name: logs/user-service.log
    pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      # %i obligatoire : rotation par taille + date (SizeAndTimeBasedRollingPolicy)
      file-name-pattern: logs/user-service-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
