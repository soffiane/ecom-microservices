spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  datasource:
    # Default "postgres" database (always present); order-service owns the "order_service" schema.
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=order_service
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Flyway creates the schema if missing, then applies classpath:db/migration
    schemas: order_service
    default-schema: order_service
  jpa:
    database: postgresql
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks the entities match it
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        default_schema: order_service
server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    shutdown:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: info
    com.ecommerce.order: trace
  file:
    name: logs/order-service.log
    pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      # %i obligatoire : rotation par taille + date (SizeAndTimeBasedRollingPolicy)
      file-name-pattern: logs/order-service-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
