spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              #              uri: http://localhost:8082
              predicates:
                - Path=/users/**
              filters:
                  - "RewritePath=/users(?<segment>/?.*), /api/v1/users${segment}"
            - id: order-service
              uri: lb://ORDER-SERVICE
              #              uri: http://localhost:8083
              predicates:
                - Path=/orders/**, /cart/**
              filters:
                  - "RewritePath=/(?<resource>orders|cart)(?<segment>/?.*), /api/v1/${resource}${segment}"
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              #              uri: http://localhost:8081
              predicates:
                - Path=/products/**
              filters:
                  - "RewritePath=/products(?<segment>/?.*), /api/v1/products${segment}"
            - id: eureka-server
              uri: http://localhost:8761
              #              uri: http://localhost:8081
              predicates:
                - Path=/eureka/main
              filters:
                - SetPath=/
            - id : eureka-server-static
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**

  application:
    name: gateway
server:
  port: 8080

management:
  tracing:
    sampling:
      # défaut 0.1 ; la décision de la gateway est propagée aux services en aval
      probability: 1.0

